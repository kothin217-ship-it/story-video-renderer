name: Render Story Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Bundle and Render with FFmpeg
        run: |
          mkdir -p work_dir
          unzip -o temp_render/project_bundle.zip -d work_dir
          python3 - << 'EOF'
          import json, shutil, subprocess
          from pathlib import Path

          work_dir = Path("work_dir")
          pkg = json.loads((work_dir / "story_package.json").read_text(encoding="utf-8"))
          clips_dir = work_dir / "clips"
          clips_dir.mkdir(exist_ok=True)

          vf_filter = "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p"
          clip_files = []

          for i, sc in enumerate(pkg.get("scenes", []), start=1):
              img_file = work_dir / "images" / f"scene_{i:02d}.png"
              clip_file = clips_dir / f"scene_{i:02d}.mp4"
              dur = float(sc.get("duration_seconds", 8) or 8)
              subprocess.run([
                  "ffmpeg", "-y", "-loop", "1", "-i", str(img_file),
                  "-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
                  "-t", str(max(1.0, dur)),
                  "-vf", vf_filter, "-c:v", "libx264", "-tune", "stillimage",
                  "-c:a", "aac", "-shortest", str(clip_file)
              ], check=True)
              clip_files.append(clip_file)

          concat_txt = work_dir / "concat.txt"
          concat_txt.write_text("\n".join([f"file '{p.resolve().as_posix()}'" for p in clip_files]), encoding="utf-8")

          merged = work_dir / "merged.mp4"
          subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(concat_txt), "-c", "copy", str(merged)], check=True)

          final_mp4 = work_dir / "final_story_video.mp4"
          srt = work_dir / "burmese_subtitles.srt"
          if srt.exists():
              subprocess.run([
                  "ffmpeg", "-y", "-i", str(merged), "-i", str(srt),
                  "-c", "copy", "-c:s", "mov_text", "-metadata:s:s:0", "language=mya", str(final_mp4)
              ], check=True)
          else:
              shutil.copyfile(merged, final_mp4)
          EOF

      - name: Upload Final MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-story-video
          path: work_dir/final_story_video.mp4
          retention-days: 1
