name: Render Story Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render MP4 from bundle
        run: |
          python3 - << 'EOF'
          import json, pathlib, shutil, subprocess, zipfile

          bundle = pathlib.Path("temp_render/project_bundle.zip")
          work = pathlib.Path("work_render")
          work.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(bundle, "r") as zf:
              zf.extractall(work)

          pkg_file = work / "story_package.json"
          pkg = json.loads(pkg_file.read_text(encoding="utf-8")) if pkg_file.exists() else {}
          scenes = pkg.get("scenes", [])
          images = sorted((work / "images").glob("*.png")) if (work / "images").exists() else []

          clips_dir = work / "clips"
          clips_dir.mkdir(parents=True, exist_ok=True)
          clip_paths = []

          vf = "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p"

          count = max(len(scenes), len(images))
          for i in range(1, count + 1):
              sc = scenes[i - 1] if i - 1 < len(scenes) else {}
              dur = max(1.0, float(sc.get("duration_seconds", 8) or 8))
              img = work / "images" / f"scene_{i:02d}.png"
              if not img.exists() and i - 1 < len(images):
                  img = images[i - 1]
              if not img.exists():
                  continue
              clip = clips_dir / f"scene_{i:02d}.mp4"
              aud = work / "voices" / f"scene_{i:02d}.mp3"
              cmd = ["ffmpeg", "-y", "-loop", "1", "-i", str(img)]
              if aud.exists():
                  cmd += ["-i", str(aud), "-vf", vf, "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k", "-shortest", str(clip)]
              else:
                  cmd += ["-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100", "-t", str(dur), "-vf", vf, "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-shortest", str(clip)]
              subprocess.run(cmd, check=True)
              clip_paths.append(clip)

          concat_txt = work / "concat_list.txt"
          concat_txt.write_text("\n".join([f"file '{p.resolve().as_posix()}'" for p in clip_paths]), encoding="utf-8")
          merged = work / "merged_nosub.mp4"
          subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(concat_txt), "-c", "copy", str(merged)], check=True)

          srt = work / "burmese_subtitles.srt"
          final_out = pathlib.Path("final_story_video.mp4")
          if srt.exists() and srt.read_text(encoding="utf-8").strip():
              res = subprocess.run(["ffmpeg", "-y", "-i", str(merged), "-i", str(srt), "-c", "copy", "-c:s", "mov_text", "-metadata:s:s:0", "language=mya", str(final_out)])
              if res.returncode != 0:
                  shutil.copyfile(merged, final_out)
          else:
              shutil.copyfile(merged, final_out)
          EOF

      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: final-story-video
          path: final_story_video.mp4
